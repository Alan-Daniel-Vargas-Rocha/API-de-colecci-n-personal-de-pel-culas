<template id="post-template">
    <div id="post-content">
        <h1 id="post-title"></h1>

        <div id="post-header">
            <img id="post-header-author-image" src="assets/img/empty-user.png" />
            <h3 id="post-header-author-name"></h3>
        </div>

        <img id="post-image" src="assets/img/post-background.png" />

        <p id="post-body"></p>

        <div id="post-author">
            <img id="author-image" src="assets/img/empty-user.png" />
            <div id="author-info">
                <h3 id="author-name"></h3>
                <p id="author-email"></p>
                <a id="author-network">More about the author</a>
            </div>
        </div>

        <div>COMMENTS HERE</div>
    </div>
</template>
