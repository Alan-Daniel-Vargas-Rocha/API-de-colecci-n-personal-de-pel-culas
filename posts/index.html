<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">

<head>
    <title>MY~BLOG</title>
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
    <!-- metadata para procesamiento del navegador -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- importación de hojas de estilos -->
    <link rel="stylesheet" href="styles/styles.css" type="text/css" />
    <link rel="stylesheet" href="styles/header.css" type="text/css" />
    <link rel="stylesheet" href="styles/buttons.css" type="text/css" />
    <!-- importación de iconos -->
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.12.1/css/all.css" crossorigin="anonymous">
    <!-- scripts -->
    <script src="scripts/main.js" type="module"></script>
</head>

<body>
    <div id="layout">
        <!-- header de la pagina -->
        <div class="header">
            <div id="logo" class="logo-content">
                <i class="fas fa-pager"></i>
                <h2>MY~BLOG</h2>
            </div>

            <div class="search-bar">
                <button id="searchBtn" class="icon-button">
                    <i class="fas fa-search"></i>
                </button>

                <input type="text" name="searchTxt" placeholder="Buscar..." />
            </div>

            <div class="profile">
                <img name="user-photo" src="assets/img/empty-user.png" />
                <h4>NOMBRE AQUI</h4>
            </div>

            <button id="logoutBtn" class="icon-button-primary">
                <i class="fas fa-sign-out-alt"></i>
            </button>
        </div>

        <!-- contenido cambiante -->
        <main id="content" class="main-content">
        </main>
    </div>
</body>

</html>
